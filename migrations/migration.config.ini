# Database Migration Configuration
# 迁移系统配置文件

[version]
# 版本编号规则
VERSION_LENGTH=10
VERSION_CHARSET=0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ

[database]
# 数据库配置
DB_PATH=data/trading.db
BACKUP_DIR=data/backups

[migration]
# 迁移脚本目录
MIGRATION_SCRIPTS_DIR=migrations/scripts
MIGRATION_TEMPLATES_DIR=migrations/templates
# 元数据表名
MIGRATION_TABLE=schema_migrations

[backup]
# 备份策略
# 在执行迁移操作（upgrade/downgrade）前自动创建数据库备份
AUTO_BACKUP_ENABLED=true
BACKUP_RETENTION_DAYS=30

[security]
# 安全设置
ALLOW_DESTRUCTIVE_OPERATIONS=false
REQUIRE_CONFIRMATION_FOR_DOWNGRADE=true